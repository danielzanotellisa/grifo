name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Test and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Husky is wired
        run: |
          test "$(git config core.hooksPath)" = ".husky/_"
          test -x .husky/commit-msg
          test -x .husky/pre-commit
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm trace
      - run: pnpm test

  commits:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint PR commits
        run: pnpm exec commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

  pr-trace:
    name: Spec and ADR in PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check Spec and ADR lines of the PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: pnpm trace:pr

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: grifo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d grifo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_MIGRATOR_URL: postgres://postgres:postgres@localhost:5432/grifo
      DATABASE_URL: postgres://app_user:app_user@localhost:5432/grifo
      DATABASE_AUTH_URL: postgres://auth_user:auth_user@localhost:5432/grifo
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start the S3-compatible storage
        run: |
          docker run -d --name s3 -p 8333:8333 \
            -v "$PWD/infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json
          timeout 90 bash -c 'until curl -s -o /dev/null http://localhost:8333; do sleep 1; done'
      - run: pnpm test:integration

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The stack a person runs, from a clean state and without a .env (spec `_cross-cutting/local-run`).
      # ClamAV is left out: nothing waits for it and it needs minutes and 1 GB. Gotenberg renders the summary PDF.
      - name: Start the stack
        run: |
          docker compose --profile app up -d --build web worker mailpit gotenberg
          timeout 300 bash -c 'until curl -fs http://localhost:3000/api/health >/dev/null; do sleep 2; done'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install the browser
        run: pnpm --filter @app/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Keep the logs of the stack
        if: failure()
        run: docker compose --profile app logs --no-color > stack.log 2>&1
      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
            stack.log
          retention-days: 7
